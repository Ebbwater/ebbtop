[package]
name = "ebbtop-gui"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ebbtop"
path = "src/main.rs"

[dependencies]
ebbtop-core = { path = "../ebbtop-core" }
anyhow = "1"
dirs = "7"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "persistence", "clipboard", "accesskit"] }
egui = "0.37"
egui_extras = "0.37"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
keyring = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-webpki-roots"] }
sha2 = "0.11"

[dev-dependencies]
egui_kittest = { version = "0.37", features = ["wgpu", "snapshot"] }

# Build-only (see build.rs): embeds the Windows .exe icon via windres.
# Not linked into the exe; Linux/macOS native builds compile it but the
# build script no-ops (CARGO_CFG_TARGET_OS gate), so the binary is
# unchanged there. Keep it a build-dependency, never a runtime one.
[build-dependencies]
winresource = "0.1"
