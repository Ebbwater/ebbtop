[package]
name = "ebbtop-core"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
prost = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
tokio-tungstenite = "0.30"
url = "2"

# Build-only (see build.rs): VERSIONINFO metadata for the Windows probe exe,
# handed to llvm-windres/windres. Not linked into the binary; Linux/macOS
# builds compile it but the build script no-ops (CARGO_CFG_TARGET_OS gate), so
# the binary is unchanged there. Keep it a build-dependency, never a runtime one.
[build-dependencies]
winresource = "0.1"
