syntax = "proto3";
package socktop;

// All running processes. Sorting is done client-side.
message Processes {
  uint64 process_count = 1;           // total processes in the system
  repeated Process rows = 2;          // all processes
  uint64 sampled_at_ms = 3;           // ebbtop: epoch ms when rows were collected
}

message Process {
  uint32 pid = 1;
  string name = 2;
  float cpu_usage = 3;                // 0..100
  uint64 mem_bytes = 4;               // RSS bytes
  string user = 5;                    // ebbtop: owner name (uid if unknown)
  string state = 6;                   // ebbtop: sysinfo status, e.g. "Sleeping"
  uint64 start_time_ms = 7;           // ebbtop: agent epoch ms when the process started (0 = unknown)
}
