[package]
name = "ebbtop-agent"
version = "0.2.0"
authors = ["Ebbwater"]
description = "EbbTop agent daemon. Serves host metrics over WebSocket (tailnet-only)."
edition = "2024"
license = "MIT"

[[bin]]
name = "ebbtop-agent"
path = "src/main.rs"

[lib]
name = "ebbtop_agent"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros", "process"] }
axum = { version = "0.7", features = ["ws", "macros"] }
axum-server = { version = "0.7" }
sysinfo = { version = "0.37", features = ["network", "disk", "component"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3.31"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
gfxinfo = { version = "0.1.2", optional = true, default-features = false, features = ["nvidia", "gpu_info"] }
nvml-wrapper = { version = "0.10", optional = true }
once_cell = "1.19"
anyhow = "1"
hostname = "0.3"
prost = "0.14"
time = { version = "0.3", default-features = false, features = ["formatting", "macros", "parsing"] }

[features]
default = ["gpu"]
gpu = ["gfxinfo", "nvml-wrapper"]
logging = ["tracing", "tracing-subscriber"]

[build-dependencies]
prost-build = "0.13"
protoc-bin-vendored = "3"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.10"
tokio-tungstenite = "0.21"
