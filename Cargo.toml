[workspace]
resolver = "3"
members = ["crates/ebbtop-core", "crates/ebbtop-gui", "crates/ebbtop-agent"]
# The agent builds on Linux but shares this workspace lockfile.

[workspace.package]
edition = "2024"
version = "0.2.1"
license = "MIT"
repository = "https://github.com/Ebbwater/ebbtop"
homepage = "https://github.com/Ebbwater/ebbtop"
publish = false

[profile.release]
# Trimmed for fast local/Mac rebuilds: no LTO and wide codegen units.
# Frame budget has huge headroom (p50 ~0.6ms), so trade a little
# optimizer output for a much faster build. `strip` stays (size).
lto = false
strip = true
codegen-units = 16
