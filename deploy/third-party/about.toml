# cargo-about configuration for the checked-in THIRD-PARTY-NOTICES file.
#
# Regenerate after any dependency change (the CI lint gates do not catch a
# stale notices file, so the regeneration belongs in the same commit):
#
#   cargo install cargo-about --locked --features cli
#   cargo about generate deploy/third-party/notices.hbs \
#       --config deploy/third-party/about.toml -o THIRD-PARTY-NOTICES
#
# Only licenses on this list ship. A dependency adding a license outside it
# fails the generation, which makes the change a reviewable event rather than
# a silently non-compliant binary.
accepted = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "MPL-2.0",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  "FTL",
  # Font licenses, for the faces compiled into the executable: epaint's
  # bundled fonts. The OFL 1.1 text also ships verbatim as LICENSE-OFL.txt
  # (and is readable in-app) because the CJK faces are separate files.
  "OFL-1.1",
  "Ubuntu-font-1.0",
]
